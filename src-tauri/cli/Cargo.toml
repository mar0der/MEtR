[package]
name = "metr-cli"
version = "26.44.0"
description = "METR command line and daemon for Linux dev machines and servers"
authors = ["MEtR"]
edition = "2021"

# Installed as `metr`; built as metr-cli so it never overwrites the desktop
# app binary (also `metr`) in a shared target folder.
[[bin]]
name = "metr-cli"
path = "src/main.rs"

[dependencies]
metr = { path = "..", default-features = false, features = ["rustls"] }
chrono = "0.4.42"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
rpassword = "7.3"
serde_json = "1.0.145"
