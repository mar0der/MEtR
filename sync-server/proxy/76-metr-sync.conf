server {
    listen 80;
    server_name metr.petarpetkov.com;
    access_log off;
    include /etc/nginx/snippets/redirect-http-to-https.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name metr.petarpetkov.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/metr.petarpetkov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metr.petarpetkov.com/privkey.pem;

    include /etc/nginx/snippets/acme-challenge.inc;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect http://metr.petarpetkov.com/ https://metr.petarpetkov.com/;
        proxy_pass http://172.17.0.1:8090;
    }
}
