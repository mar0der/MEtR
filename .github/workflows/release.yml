name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Install Apple certificate
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build macOS
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: ./macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: ./windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: ./linux

      - name: Flatten and rename artifacts
        run: |
          # Flatten macOS artifacts (upload preserves directory structure)
          mv ./macos/dmg/*.dmg ./macos/ 2>/dev/null || true
          mv ./macos/macos/*.tar.gz ./macos/ 2>/dev/null || true
          mv ./macos/macos/*.sig ./macos/ 2>/dev/null || true
          # Flatten Windows artifacts
          mv ./windows/msi/*.msi ./windows/ 2>/dev/null || true
          mv ./windows/msi/*.sig ./windows/ 2>/dev/null || true
          # Flatten Linux artifacts
          mv ./linux/deb/*.deb ./linux/ 2>/dev/null || true
          mv ./linux/appimage/*.AppImage ./linux/ 2>/dev/null || true
          mv ./linux/appimage/*.sig ./linux/ 2>/dev/null || true
          # Rename updater archives with version
          mv ./macos/MEtR.app.tar.gz "./macos/MEtR_${VERSION}_aarch64.app.tar.gz"
          mv ./macos/MEtR.app.tar.gz.sig "./macos/MEtR_${VERSION}_aarch64.app.tar.gz.sig"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MEtR v${{ env.VERSION }}
          files: |
            ./macos/*.dmg
            ./macos/*.tar.gz
            ./macos/*.sig
            ./windows/*.msi
            ./windows/*.sig
            ./linux/*.deb
            ./linux/*.AppImage
            ./linux/*.sig
          generate_release_notes: true

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --accept-dns=true

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload artifacts to server
        run: |
          # macOS installer → public releases
          scp -i ~/.ssh/deploy_key ./macos/*.dmg ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/metr-sync/site/storage/releases/

          # macOS updater → Laravel storage
          scp -i ~/.ssh/deploy_key "./macos/MEtR_${VERSION}_aarch64.app.tar.gz" ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/metr-sync/site/backend/storage/app/updates/
          scp -i ~/.ssh/deploy_key "./macos/MEtR_${VERSION}_aarch64.app.tar.gz.sig" ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/metr-sync/site/backend/storage/app/updates/

          # Windows installer → public releases
          scp -i ~/.ssh/deploy_key ./windows/*.msi ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/metr-sync/site/storage/releases/

          # Windows updater → Laravel storage
          scp -i ~/.ssh/deploy_key "./windows/MEtR_${VERSION}_x64_en-US.msi" ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/metr-sync/site/backend/storage/app/updates/
          scp -i ~/.ssh/deploy_key "./windows/MEtR_${VERSION}_x64_en-US.msi.sig" ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/metr-sync/site/backend/storage/app/updates/

          # Linux installer → public releases
          scp -i ~/.ssh/deploy_key ./linux/*.deb ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/metr-sync/site/storage/releases/

          # Linux updater → Laravel storage
          scp -i ~/.ssh/deploy_key ./linux/*.AppImage ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/metr-sync/site/backend/storage/app/updates/ 2>/dev/null || true
          scp -i ~/.ssh/deploy_key ./linux/*.AppImage.sig ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/metr-sync/site/backend/storage/app/updates/ 2>/dev/null || true

          # Copy installers to updates dir for Laravel publish
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cp /opt/metr-sync/site/storage/releases/MEtR_${VERSION}_aarch64.dmg /opt/metr-sync/site/backend/storage/app/updates/ && cp /opt/metr-sync/site/storage/releases/MEtR_${VERSION}_x64_en-US.msi /opt/metr-sync/site/backend/storage/app/updates/ && cp /opt/metr-sync/site/storage/releases/MEtR_${VERSION}_amd64.deb /opt/metr-sync/site/backend/storage/app/updates/ 2>/dev/null || true"

      - name: Publish release to update server
        run: |
          NOTES="Auto-release from GitHub Actions"
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "docker exec metr-sync-php php artisan metr:release:publish --release-version=${VERSION} --notes='${NOTES}' --darwin-tgz=/var/www/html/storage/app/updates/MEtR_${VERSION}_aarch64.app.tar.gz --darwin-sig=/var/www/html/storage/app/updates/MEtR_${VERSION}_aarch64.app.tar.gz.sig --darwin-dmg=/var/www/html/storage/app/updates/MEtR_${VERSION}_aarch64.dmg --windows-msi=/var/www/html/storage/app/updates/MEtR_${VERSION}_x64_en-US.msi --windows-sig=/var/www/html/storage/app/updates/MEtR_${VERSION}_x64_en-US.msi.sig --linux-deb=/var/www/html/storage/app/updates/MEtR_${VERSION}_amd64.deb --linux-appimage=/var/www/html/storage/app/updates/MEtR_${VERSION}_amd64.AppImage --force"
